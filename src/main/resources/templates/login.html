<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PRO-BUILD Ferretería</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External Modular CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

    <!-- Navbar Minimalista -->
    <nav class="navbar navbar-dark navbar-main py-3">
        <div class="container justify-content-between">
            <a class="navbar-brand d-flex align-items-center gap-3" href="#">
                <div class="brand-logo-badge">
                    <i class="bi bi-tools"></i>
                </div>
                <div>
                    <div class="brand-title">PRO-BUILD <span class="brand-accent">FERRETERÍA</span></div>
                    <div style="font-size: 0.7rem; color: #94a3b8; letter-spacing: 0.8px; font-weight: 700; text-transform: uppercase;">Acceso al Sistema</div>
                </div>
            </a>

            <!-- Dark Mode Switch -->
            <button class="btn-theme-switch" id="themeToggleBtn" onclick="toggleDarkMode()">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                <span id="themeText">Modo Oscuro</span>
            </button>
        </div>
    </nav>

    <!-- Container Principal Login -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background: var(--card-bg); border: 1px solid var(--border-color) !important;">
                    
                    <!-- Header Card -->
                    <div class="p-4 text-center" style="background: var(--brand-slate); color: #ffffff;">
                        <div class="d-inline-flex p-3 rounded-circle bg-white text-dark shadow-sm mb-3">
                            <i class="bi bi-person-lock fs-2 text-warning"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Bienvenido a PRO-BUILD</h4>
                        <p class="text-slate-300 small m-0">Ingresa tus credenciales para acceder al sistema de inventarios</p>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- Alertas de Error y Logout -->
                        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 rounded-3 small mb-4">
                            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                            <div>Usuario o contraseña incorrectos. Verifica tus credenciales.</div>
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 rounded-3 small mb-4">
                            <i class="bi bi-check-circle-fill fs-5"></i>
                            <div>Has cerrado sesión exitosamente.</div>
                        </div>

                        <!-- Formulario de Login -->
                        <form th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold small">Nombre de Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
                                    <input type="text" id="username" name="username" class="form-control form-control-lg border-start-0 ps-0 fs-6" placeholder="Ej. admin o cliente" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold small">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                    <input type="password" id="password" name="password" class="form-control form-control-lg border-start-0 ps-0 fs-6" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-brand btn-lg w-100 fw-bold fs-6">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Corporate -->
    <footer class="py-4 mt-auto">
        <div class="container text-center small text-muted">
            &copy; 2026 <strong>PRO-BUILD Ferretería Industrial</strong> &mdash; Todos los derechos reservados
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- External JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
